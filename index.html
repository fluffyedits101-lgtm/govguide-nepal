<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GovGuide Nepal</title>
<meta name="theme-color" content="#0f5c5c">
<meta name="description" content="Find Nepal government services: document checklist, steps, the right office and the official application.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@600;700&display=swap">
<style>
:root{--bg:#f6f4ee;--surface:#fff;--ink:#1d2a2a;--muted:#5d6b6b;--line:#dcd8cc;--teal:#0f5c5c;--teal-ink:#fff;--gold:#e8a317;--soft:#e6efed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1a;--surface:#1b2626;--ink:#e9efee;--muted:#9fb0ae;--line:#2f3d3d;--teal:#5fc2b8;--teal-ink:#0b1414;--gold:#f0b73a;--soft:#223433}}
:root[data-theme="dark"]{--bg:#121a1a;--surface:#1b2626;--ink:#e9efee;--muted:#9fb0ae;--line:#2f3d3d;--teal:#5fc2b8;--teal-ink:#0b1414;--gold:#f0b73a;--soft:#223433}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans","Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:"Noto Serif","Noto Serif Devanagari",Georgia,serif;line-height:1.2;margin:0}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.1rem;margin:28px 0 10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.flag{display:inline-block;width:14px;height:14px;background:var(--gold);transform:rotate(45deg);border-radius:2px}
.tag{color:var(--muted);margin:0 0 20px}
input[type=search],select{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.list{display:grid;gap:10px;margin-top:16px}
.svc{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:14px 16px;cursor:pointer}
.svc:hover{background:var(--soft)}
.svc b{display:block;font-family:"Noto Serif","Noto Serif Devanagari",serif}
.svc span{color:var(--muted);font-size:.92rem}
.empty{color:var(--muted);padding:20px 0}
.back{background:none;border:0;color:var(--teal);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.pill{font:inherit;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pill[aria-pressed=true]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.q{color:var(--muted);margin:14px 0 0;font-size:.95rem}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--teal);flex:none}
.check small{display:block;color:var(--muted)}
.check.done{opacity:.6}.check.done span.t{text-decoration:line-through}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 16px 44px;border-left:0}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:600;font-size:.9rem}
ol.steps li:after{content:"";position:absolute;left:14px;top:34px;bottom:4px;width:2px;background:var(--line)}
ol.steps li:last-child:after{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card p{margin:4px 0}
.meta{color:var(--muted);font-size:.92rem}
.btn{display:inline-block;margin-top:10px;background:var(--teal);color:var(--teal-ink);text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px}
.note{margin-top:32px;padding:12px 14px;border-left:4px solid var(--gold);background:var(--soft);font-size:.9rem;border-radius:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.top .back{margin:0}.lang{font:inherit;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--teal);background:var(--surface);color:var(--teal);cursor:pointer;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script src="data-en.js"></script>
<script src="data-ne.js"></script>
<script src="app.js"></script>
</body>
</html>
